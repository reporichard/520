async function typeLetterText(text){

    const target =
    document.getElementById("letterContent");

    target.innerHTML = "";

    let currentText = "";

    for(let i = 0; i < text.length; i++){

        const char = text[i];

        // ENTER
        if(char === "\n"){

            currentText += "<br><br>";

            target.innerHTML = currentText;

            await sleep(1200);

            continue;
        }

        currentText += char;

        target.innerHTML = currentText;

        let delay = 90;

        // koma
        if("，、".includes(char)){
            delay = 400;
        }

        // titik
        if("。！？".includes(char)){
            delay = 1000;
        }

        // titik panjang
        if("～…".includes(char)){
            delay = 700;
        }

        await sleep(delay);
    }
}

function sleep(ms){
    return new Promise(r => setTimeout(r, ms));
}

        .style.display = "flex";

        .style.display = "none";

    }
}
